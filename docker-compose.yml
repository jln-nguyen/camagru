services:
  nginx: 
    build: docker/nginx/.
    container_name: nginx
    image : nginx
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - camagru_network

  app:
    build: docker/app/.
    container_name: app
    image: app
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on :
      - mysql
    networks:
      - camagru_network

  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - camagru_network

volumes:
  mysql-data:

networks:
  camagru_network: